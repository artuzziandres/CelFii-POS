name: Cel-Fii Windows
on:
  push:
    branches: [codex/celfii-windows]
    paths: ['windows/**', '.github/workflows/celfii-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Comprobar inicio real de Windows
        run: |
          $p = Start-Process -FilePath './node_modules/electron/dist/electron.exe' -ArgumentList '.', '--ui-smoke' -Wait -PassThru -RedirectStandardOutput smoke.log -RedirectStandardError smoke-error.log
          Get-Content smoke.log
          Get-Content smoke-error.log
          if ($p.ExitCode -ne 0) { throw 'Falló el inicio de Cel-Fii Windows' }
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: CelFii-Windows-1.0.0
          path: |
            windows/dist/*Instalador.exe
            windows/test-output/interfaz.png
            windows/smoke.log
          retention-days: 14
