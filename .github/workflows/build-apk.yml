name: Compilar Cel-Fii Ventas Nueva

on:
  workflow_dispatch:
  push:
    branches: [agent/celfii-ventas-nueva]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - run: gradle :appv2:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: CelFii-Ventas-Nueva-APK
          path: appv2/build/outputs/apk/debug/appv2-debug.apk
          if-no-files-found: error
