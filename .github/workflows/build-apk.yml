name: Compilar Cel-Fii Ventas

on:
  workflow_dispatch:
  push:
    branches: [agent/celfii-ventas-nueva]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Preparar firma estable de pruebas
        run: |
          mkdir -p "$HOME/.android"
          cp signing/celfii-debug.keystore "$HOME/.android/debug.keystore"
      - name: Compilar APK 0.6.4
        run: gradle :appv2:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Cel-Fii-Ventas-0.6.4
          path: appv2/build/outputs/apk/debug/appv2-debug.apk
          if-no-files-found: error
