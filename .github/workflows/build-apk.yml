name: Compilar APK Remaster
on:
  workflow_dispatch:
    inputs:
      web_url:
        description: URL /exec del despliegue de Apps Script
        required: true
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - name: Compilar APK
        working-directory: android
        env:
          CELFII_WEB_URL: "${{ inputs.web_url || vars.CELFII_WEB_URL || 'https://script.google.com/macros/s/AKfycbzIVmExrNsKCTczuZ9oi-ZvN7pGbUeVFOCh1_gnTKUiFlYlcvq-dnsY2nGccDHkOmvUUw/exec' }}"
        run: gradle assembleDebug -PCELFII_WEB_URL="$CELFII_WEB_URL"
      - name: Preparar APK para entrega directa
        working-directory: android
        run: |
          echo APK_BASE64_START
          base64 -w 0 app/build/outputs/apk/debug/app-debug.apk
          echo
          echo APK_BASE64_END
      - uses: actions/upload-artifact@v4
        with:
          name: CelFii-Ventas-Remaster-1.0.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
