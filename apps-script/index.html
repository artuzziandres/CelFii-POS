<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b09"><title>Cel-Fii Ventas</title>
<style>
:root{--bg:#080b09;--panel:#111612;--panel2:#182019;--lime:#aaff00;--text:#f4f7f4;--muted:#9da69f;--danger:#ff6262;--line:#29352c;--radius:20px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% -10%,#253818 0,transparent 34%),var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{max-width:1200px;margin:auto;padding:20px 18px 100px}header{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{display:flex;align-items:center;gap:13px}.logo{width:50px;height:50px;border-radius:16px;background:var(--lime);color:#050705;display:grid;place-items:center;font-weight:1000;font-size:19px;box-shadow:0 0 30px #aaff0035}.brand h1{font-size:22px;margin:0}.brand small{color:var(--muted)}button,input,select{font:inherit}.top-actions{display:flex;gap:8px}.icon-btn,.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:11px 14px;border-radius:13px;cursor:pointer}.btn.primary{background:var(--lime);border-color:var(--lime);color:#060806;font-weight:800}.btn.danger{color:var(--danger)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}.tab{white-space:nowrap}.tab.active{background:var(--lime);color:#050705;border-color:var(--lime);font-weight:800}.grid{display:grid;grid-template-columns:1fr 360px;gap:18px}.panel{background:#111612dd;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:0 14px 40px #0005}.search{width:100%;background:#090d0a;border:1px solid var(--line);color:var(--text);padding:14px 16px;border-radius:14px;outline:none;margin-bottom:14px}.search:focus{border-color:var(--lime)}.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.product{background:var(--panel2);border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;flex-direction:column;gap:9px}.product.soldout{opacity:.55}.photo{height:120px;border-radius:13px;background:#0a0e0b center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font-size:12px}.product h3{margin:0;font-size:15px}.meta{color:var(--muted);font-size:12px}.price{color:var(--lime);font-size:20px;font-weight:900}.stock{font-size:12px}.product .btn{width:100%;margin-top:auto}.cart{position:sticky;top:16px;height:max-content}.cart h2,.section-title{margin:0 0 14px}.cart-line{display:grid;grid-template-columns:1fr auto;gap:5px;padding:11px 0;border-bottom:1px solid var(--line)}.cart-line small{color:var(--muted)}.qty{display:flex;align-items:center;gap:8px}.qty button{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:#0a0e0b;color:white}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:900;margin:17px 0}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field select{background:#090d0a;color:var(--text);border:1px solid var(--line);padding:12px;border-radius:12px}.empty{padding:40px;text-align:center;color:var(--muted)}.list{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:12px;background:var(--panel2);padding:14px;border-radius:14px;border:1px solid var(--line)}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#29352c;color:var(--lime);font-size:11px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f4f7f4;color:#080b09;padding:13px 18px;border-radius:14px;font-weight:700;z-index:10;box-shadow:0 10px 40px #0008}.hidden{display:none!important}.loading{position:fixed;inset:0;background:#080b09cc;display:grid;place-items:center;z-index:20}.spinner{width:42px;height:42px;border:4px solid #30402f;border-top-color:var(--lime);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:800px){.app{padding:14px 12px 90px}.grid{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start}.top-actions{flex-direction:column}.photo{height:100px}}@media(max-width:430px){.products{grid-template-columns:1fr}.brand h1{font-size:18px}}
</style></head><body><div id="loading" class="loading"><div class="spinner"></div></div><main class="app">
<header><div class="brand"><div class="logo">CF</div><div><h1>Cel-Fii Ventas</h1><small>Remaster · stock en tiempo real</small></div></div><div class="top-actions"><button class="icon-btn" onclick="refresh()">Actualizar</button><button class="icon-btn" onclick="configure()">Conexión</button></div></header>
<nav class="tabs"><button class="btn tab active" data-view="shop">Venta</button><button class="btn tab" data-view="orders">Pedidos</button><button class="btn tab" data-view="sales">Historial</button></nav>
<section id="shop"><div class="grid"><div class="panel"><input id="search" class="search" placeholder="Buscar producto, código, marca o modelo…"><div id="products" class="products"></div></div><aside class="panel cart"><h2>Venta actual</h2><div id="cart"></div><div class="field"><label>Vendedor</label><select id="seller"><option>Andres</option><option>Maxi</option></select></div><div class="field"><label>Cliente (opcional)</label><input id="customer" placeholder="Nombre y apellido"></div><div class="field"><label>Teléfono (opcional)</label><input id="phone" inputmode="tel" placeholder="11 0000 0000"></div><div class="field"><label>Medio de pago</label><select id="payment"><option>Efectivo</option><option>Transferencia</option><option>Débito</option><option>Crédito 3 cuotas</option></select></div><div class="total"><span>Total</span><span id="total">$0</span></div><button class="btn primary" style="width:100%" onclick="checkout()">Confirmar venta</button></aside></div></section>
<section id="orders" class="panel hidden"><h2 class="section-title">Pedidos web</h2><div id="orderList" class="list"></div></section>
<section id="sales" class="panel hidden"><h2 class="section-title">Historial de ventas</h2><div id="saleList" class="list"></div></section>
</main><div id="toast" class="toast hidden"></div>
<script>
const state={products:[],cart:new Map(),sales:[],orders:[],token:localStorage.getItem('celfii_token')||''};
const money=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0});
const apiUrl=<?!= JSON.stringify(apiUrl) ?>;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.view));
document.getElementById('search').oninput=renderProducts;
function configure(){const token=prompt('Token de conexión',state.token);if(token!==null){state.token=token.trim();localStorage.setItem('celfii_token',state.token);refresh();}}
async function api(action,data){if(!state.token)throw new Error('Configurá el token de conexión');let res;if(data){res=await fetch(apiUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...data,action,token:state.token})});}else{res=await fetch(apiUrl+'?action='+encodeURIComponent(action)+'&token='+encodeURIComponent(state.token));}const out=await res.json();if(!out.ok)throw new Error(out.error||'Error de conexión');return out;}
async function refresh(){busy(true);try{const [p,s,o]=await Promise.all([api('products'),api('sales'),api('orders')]);state.products=p.products;state.sales=s.sales;state.orders=o.orders;renderProducts();renderCart();renderSales();renderOrders();}catch(e){toast(e.message,true);if(!state.token)setTimeout(configure,200);}finally{busy(false)}}
function show(name){['shop','orders','sales'].forEach(v=>document.getElementById(v).classList.toggle('hidden',v!==name));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===name));}
function photo(p){return p.photoUrl||''}
function renderProducts(){const q=document.getElementById('search').value.toLowerCase().trim();const rows=state.products.filter(p=>!q||[p.name,p.category,p.code,p.backupCode,p.brand,p.models].join(' ').toLowerCase().includes(q));document.getElementById('products').innerHTML=rows.length?rows.map(p=>`<article class="product ${p.stock<=0?'soldout':''}"><div class="photo" ${photo(p)?`style="background-image:url('${escapeAttr(photo(p))}')"`:''}>${photo(p)?'':'Sin foto'}</div><div class="meta">${esc(p.category||'Sin categoría')}</div><h3>${esc(p.name)}</h3><div class="price">${money.format(p.cashPrice)}</div><div class="stock">${p.stock>0?`Stock: ${p.stock}`:'Sin stock'}</div><button class="btn ${p.stock>0?'primary':''}" ${p.stock<=0?'disabled':''} onclick="add('${escapeAttr(p.id)}')">Agregar</button></article>`).join(''):'<div class="empty">No se encontraron productos</div>';}
function add(id){const p=state.products.find(x=>x.id===id);if(!p||p.stock<=0)return;const line=state.cart.get(id)||{product:p,quantity:0,unitPrice:p.cashPrice};if(line.quantity>=p.stock)return toast('No hay más stock');line.quantity++;state.cart.set(id,line);renderCart();}
function qty(id,delta){const l=state.cart.get(id);if(!l)return;l.quantity+=delta;if(l.quantity<=0)state.cart.delete(id);else if(l.quantity>l.product.stock)l.quantity=l.product.stock;renderCart();}
function renderCart(){const root=document.getElementById('cart');const lines=[...state.cart.values()];root.innerHTML=lines.length?lines.map(l=>`<div class="cart-line"><div><b>${esc(l.product.name)}</b><br><small>${money.format(l.unitPrice)} c/u</small></div><div class="qty"><button onclick="qty('${escapeAttr(l.product.id)}',-1)">−</button><b>${l.quantity}</b><button onclick="qty('${escapeAttr(l.product.id)}',1)">+</button></div></div>`).join(''):'<div class="empty">Agregá productos</div>';document.getElementById('total').textContent=money.format(lines.reduce((a,l)=>a+l.quantity*l.unitPrice,0));}
async function checkout(){const lines=[...state.cart.values()];if(!lines.length)return toast('La venta está vacía',true);busy(true);try{const out=await api('createSale',{clientRequestId:crypto.randomUUID(),seller:value('seller'),payment:value('payment'),customerName:value('customer'),customerPhone:value('phone'),warrantyDays:30,lines:lines.map(l=>({productId:l.product.id,quantity:l.quantity,unitPrice:l.unitPrice}))});state.cart.clear();toast('Venta '+out.saleId+' confirmada');await refresh();}catch(e){toast(e.message,true);}finally{busy(false)}}
function renderSales(){const root=document.getElementById('saleList');root.innerHTML=state.sales.length?state.sales.map(s=>`<div class="row"><div><b>${esc(s.idVenta)}</b><br><small>${esc(s.Fecha)} · ${esc(s.Vendedor)}</small></div><div style="text-align:right"><b>${money.format(Number(s.Total)||0)}</b><br><span class="badge">${esc(s.Estado)}</span></div></div>`).join(''):'<div class="empty">Todavía no hay ventas</div>';}
function renderOrders(){const root=document.getElementById('orderList');root.innerHTML=state.orders.length?state.orders.map(o=>`<div class="row"><div><b>${esc(o.Ticket)}</b><br><small>${esc(o['Cliente Nombre'])} · ${esc(o.Fecha)}</small></div><div style="text-align:right"><b>${money.format(Number(o.Total)||0)}</b><br><span class="badge">${esc(o.Estado)}</span>${o.Estado==='Pendiente'?`<br><button class="btn primary" style="margin-top:7px" onclick="confirmOrder('${escapeAttr(o.Ticket)}')">Confirmar</button>`:''}</div></div>`).join(''):'<div class="empty">No hay pedidos pendientes</div>';}
async function confirmOrder(ticket){busy(true);try{const out=await api('confirmOrder',{ticket,seller:value('seller')});toast('Pedido convertido en venta '+out.saleId);await refresh();}catch(e){toast(e.message,true)}finally{busy(false)}}
function value(id){return document.getElementById(id).value.trim()}function busy(on){document.getElementById('loading').classList.toggle('hidden',!on)}function toast(msg,error){const el=document.getElementById('toast');el.textContent=msg;el.style.background=error?'#ff6262':'#f4f7f4';el.classList.remove('hidden');setTimeout(()=>el.classList.add('hidden'),3500)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(v){return esc(v)}
refresh();
</script></body></html>
